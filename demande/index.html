/* Lien court (lien en bio) : renvoie vers l'outil de la dernière ville choisie, en gardant les options de l'URL. */

  var v = "casablanca";
  try { var s = JSON.parse(localStorage.getItem("nk-ville")); if (/^[a-z-]+$/.test(s)) v = s; } catch (e) {}
  location.replace("../" + v + "/" + location.search);
})();
</script>
